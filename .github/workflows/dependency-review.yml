# =============================================================================
# Dependency review — ai-fantasy
#
# Bloqueia PRs que introduzam dependências com vulnerabilidades conhecidas ou
# licenças incompatíveis. Sem manifesto (F0), o job é inócuo.
# =============================================================================

name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
