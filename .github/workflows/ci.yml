# =============================================================================
# CI — ai-fantasy
#
# Princípios:
#  - o job `build` é o agregador e o required status check do ruleset;
#  - `node`, `e2e` e `mutation` só correm quando existe package.json;
#  - nenhum job depende de modelos, chaves, GPU ou rede fora do GitHub e do npm;
#  - actions fixadas por SHA (ver oss-pin-actions.sh).
#
# Ordem (testing-strategy §13): instalar → lint → tipos → testes com cobertura →
# cobertura das linhas novas → licenças → E2E → benchmark (se o motor mudou) →
# mutação incremental → documentação e governança → `build`. `node`, `e2e`,
# `mutation` e `docs` rodam em paralelo; `build` agrega todos.
# `npm run check` repete localmente todos esses passos, menos dois que só o CI faz:
# os links da documentação (lychee) e as mensagens dos commits (job `build`; na
# máquina, o hook commit-msg e o oss-gate.sh fazem esse papel).
# =============================================================================

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

      - name: Links locais (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --accept 200,204,206,429 "**/*.md"
          fail: true

      - name: Node.js (versão do .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Arquivos obrigatórios e espelho CLAUDE.md ↔ AGENTS.md (só usa módulos do Node;
      # não precisa de npm ci). O mesmo script roda no `npm run check`.
      - name: Governança mínima
        run: npm run governance

  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_node: ${{ steps.check.outputs.has_node }}
      engine_changed: ${{ steps.check.outputs.engine_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detectar o monorepo e mudanças no motor
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -f package.json ]; then has_node=true; else has_node=false; fi
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          elif [ "$EVENT" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          fi
          # Sem intervalo conhecido (dispatch, branch nova), roda o benchmark por segurança.
          if [ -z "$range" ] || [ -n "$(git diff --name-only "$range" -- packages/engine)" ]; then
            engine_changed=true
          else
            engine_changed=false
          fi
          echo "has_node=${has_node}" >> "$GITHUB_OUTPUT"
          echo "engine_changed=${engine_changed}" >> "$GITHUB_OUTPUT"
          echo "monorepo: ${has_node} · motor mudou: ${engine_changed} (${range:-sem intervalo})"

  node:
    name: node
    needs: preflight
    if: needs.preflight.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js (versão do .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint e Prettier)
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes com cobertura (limiares do ADR 0018)
        run: npm run coverage

      - name: Cobertura das linhas novas (mínimo 95%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run coverage:diff -- --base "origin/${BASE_REF}"

      - name: Licenças das dependências (ADR 0019)
        run: npm run licenses

      - name: Benchmark do motor
        if: needs.preflight.outputs.engine_changed == 'true'
        run: |
          npm run bench
          cat reports/bench.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload da cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: e2e
    needs: preflight
    if: needs.preflight.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js (versão do .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  mutation:
    name: mutation
    needs: preflight
    if: needs.preflight.outputs.has_node == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js (versão do .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Mutação incremental (arquivos de produção mudados)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run mutation:changed -- --base "origin/${BASE_REF}"

      - name: Relatórios de mutação
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: |
            packages/*/reports/mutation/
            apps/*/reports/mutation/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: build
    needs: [preflight, docs, node, e2e, mutation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Falhar se um job necessário falhou
        env:
          EVENT: ${{ github.event_name }}
          HAS_NODE: ${{ needs.preflight.outputs.has_node }}
          PREFLIGHT: ${{ needs.preflight.result }}
          DOCS: ${{ needs.docs.result }}
          NODE: ${{ needs.node.result }}
          E2E: ${{ needs.e2e.result }}
          MUTATION: ${{ needs.mutation.result }}
        run: |
          set -uo pipefail
          fail=0
          # require <job> <resultado> <aceitos...>
          require() {
            local job="$1" result="$2"; shift 2
            for accepted in "$@"; do [ "$result" = "$accepted" ] && return 0; done
            echo "::error::job ${job} terminou como '${result}' (esperado: $*)"
            fail=1
          }
          require preflight "$PREFLIGHT" success
          require docs "$DOCS" success
          if [ "$HAS_NODE" = "true" ]; then
            require node "$NODE" success
            require e2e "$E2E" success
            if [ "$EVENT" = "pull_request" ]; then
              require mutation "$MUTATION" success
            else
              require mutation "$MUTATION" skipped
            fi
          fi
          exit "$fail"

      - name: Commits convencionais (últimos 25)
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          header = re.compile(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]*\))?!?: .+')
          # Isenções de AUTOMAÇÃO: merge/revert do git e commits agrupados de
          # bots (`tipo(deps)(deps):`, não reescrevíveis sem rebase). Humanos
          # não usam estes padrões; o título do PR/squash impõe a convenção.
          skip = re.compile(r'^(Merge |Revert "|Reapply "|fixup!|squash!)|^\w+\(deps\)\(deps\): ')
          out = subprocess.run(['git', 'log', '--pretty=tformat:%s', '-n', '25', 'HEAD'],
                               capture_output=True, text=True).stdout
          bad = 0
          for s in out.splitlines():
              s = s.strip()
              if not s or skip.match(s):
                  continue
              h = re.sub(r'\s+\(#\d+\)$', '', s)
              if not header.match(h) or len(h) > 72:
                  print('ERRO: mensagem fora de Conventional Commits:', s)
                  bad = 1
              else:
                  print('OK  :', s)
          sys.exit(bad)
          PY

      - name: Resumo
        env:
          DOCS: ${{ needs.docs.result }}
          NODE: ${{ needs.node.result }}
          E2E: ${{ needs.e2e.result }}
          MUTATION: ${{ needs.mutation.result }}
        run: |
          {
            echo "### CI"
            echo "- docs: ${DOCS}"
            echo "- node (lint, tipos, testes, cobertura, licenças, benchmark): ${NODE}"
            echo "- e2e: ${E2E}"
            echo "- mutation (incremental, só em PR): ${MUTATION}"
          } >> "$GITHUB_STEP_SUMMARY"
